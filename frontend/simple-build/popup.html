<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Solis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 500px;
      min-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #37352f;
    }
    
    .header {
      background: #f7f6f3;
      padding: 16px 20px;
      border-bottom: 1px solid #e9e9e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 20px;
      font-weight: 700;
    }
    
    .tabs {
      display: flex;
      gap: 8px;
      background: #f7f6f3;
      padding: 12px 20px;
      border-bottom: 1px solid #e9e9e7;
    }
    
    .tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
    }
    
    .tab.active {
      background: #ffffff;
    }
    
    .content {
      padding: 24px 20px;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .input-section {
      margin-bottom: 20px;
    }
    
    .event-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    label {
      font-size: 13px;
      font-weight: 500;
      color: #37352f;
    }
    
    input[type="text"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e9e9e7;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: #37352f;
      background: white;
      transition: border-color 0.2s;
    }
    
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2383e2;
      box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.1);
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    select {
      cursor: pointer;
    }
    
    small {
      font-size: 12px;
      color: #787774;
      margin-top: -4px;
    }
    
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      justify-content: flex-end;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-cancel {
      background: transparent;
      color: #787774;
      border: 1px solid #e9e9e7;
    }
    
    .btn-cancel:hover {
      background: #f7f6f3;
    }
    
    .btn-submit {
      background: #2383e2;
      color: white;
    }
    
    .btn-submit:hover {
      background: #1a6bb8;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(35, 131, 226, 0.3);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .loader {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 14px;
    }
    
    .success {
      background: #e6f4f1;
      color: #0f7b6c;
      border: 1px solid #b3e0d6;
    }
    
    .error {
      background: #fbe4e4;
      color: #e03e3e;
      border: 1px solid #f5c2c2;
    }
    
    .login-section {
      text-align: center;
      padding: 40px 20px;
    }
    
    .login-section h2 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    
    .login-section p {
      color: #787774;
      margin-bottom: 24px;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2383e2, #9065b0);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    
    .parsed-event {
      background: #f7f6f3;
      padding: 16px;
      border-radius: 6px;
      margin-top: 16px;
    }
    
    .parsed-event h3 {
      margin-bottom: 12px;
    }
    
    .event-field {
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .event-field strong {
      color: #787774;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">☀️ Solis</div>
    <div class="user-info" id="userInfo" style="display: none;">
      <div class="avatar" id="userAvatar"></div>
      <span id="userName"></span>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" onclick="switchTab('home')">🏠 Home</button>
    <button class="tab" onclick="switchTab('settings')">⚙️ Settings</button>
  </div>
  
  <div class="content">
    <!-- Home Tab -->
    <div id="home" class="tab-content active">
      <h2 style="margin-bottom: 16px;">Add New Event</h2>
      
      <form id="eventForm" class="event-form">
        <div class="form-group">
          <label for="eventName">Event Name *</label>
          <input type="text" id="eventName" placeholder="e.g., Coffee with John" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Start Date *</label>
            <input type="date" id="startDate" required>
          </div>
          <div class="form-group">
            <label for="startTime">Start Time *</label>
            <input type="time" id="startTime" required>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="endDate">End Date *</label>
            <input type="date" id="endDate" required>
          </div>
          <div class="form-group">
            <label for="endTime">End Time *</label>
            <input type="time" id="endTime" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="eventDescription">Event Description</label>
          <textarea id="eventDescription" rows="3" placeholder="Add details about your event..."></textarea>
        </div>
        
        <div class="form-group">
          <label for="eventFlexibility">Event Flexibility *</label>
          <select id="eventFlexibility" required>
            <option value="">Select flexibility...</option>
            <option value="Rigid">Rigid - Can't be moved or overlapped</option>
            <option value="Passive">Passive - Can overlap but can't move</option>
            <option value="Busy">Busy - Can move but can't overlap</option>
            <option value="Flexible">Flexible - Can overlap and move</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="eventGuests">Event Guests (Email addresses)</label>
          <input type="text" id="eventGuests" placeholder="email@example.com, another@example.com">
          <small>Separate multiple emails with commas</small>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="cancelForm()">Cancel</button>
          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="submitText">Add to Calendar</span>
            <span id="submitLoader" class="loader" style="display: none;"></span>
          </button>
        </div>
      </form>
      
      <div id="message"></div>
    </div>
    
    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
      <div class="login-section">
        <h2>Connect Google Calendar</h2>
        <p>Sign in to start using Solis</p>
        <button onclick="login()">Connect with Google</button>
        <div id="settingsMessage"></div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
